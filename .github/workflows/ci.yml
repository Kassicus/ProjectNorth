name: CI

# The test suite is the solo developer's only code reviewer (TECH §8) — CI is what
# makes it unskippable.
on:
  push:
  pull_request:
  workflow_dispatch:

# A new push supersedes the run it interrupted; no point finishing the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-tests:
    name: Sim tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Single source of truth for the SDK version — see CLAUDE.md "Pinned toolchain".
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ProjectNorth.sln

      # Warnings are errors (Directory.Build.props), so this step is also the style gate.
      - name: Build
        run: dotnet build ProjectNorth.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ProjectNorth.sln --no-build --configuration Release

      # CLAUDE.md rule 1. There is already a unit test asserting the Sim assembly carries no
      # Godot reference; this catches the source-level mistake earlier and with a clearer
      # message. Doc comments mention Godot constantly — always to say it is not used — so
      # comment lines are excluded rather than matched.
      - name: Assert Sim is Godot-free
        run: |
          hits=$(find src/ProjectNorth.Sim -name '*.cs' \
                   -not -path '*/obj/*' -not -path '*/bin/*' \
                   -exec grep -Hn 'Godot' {} + \
                 | grep -vE ':[[:space:]]*(///|//|\*)' || true)
          if [ -n "$hits" ]; then
            echo "::error::Sim must never reference Godot (CLAUDE.md rule 1):"
            echo "$hits"
            exit 1
          fi
          echo "Sim is Godot-free."
